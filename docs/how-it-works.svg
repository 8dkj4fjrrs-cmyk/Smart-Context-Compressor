<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" width="1240" height="800" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475467"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0E7C86"/>
    </marker>
  </defs>
  <rect width="1240" height="800" fill="#FFFFFF"/>

  <!-- agent -->
  <rect x="60" y="36" width="520" height="84" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="320" y="72" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">Agent</text>
  <text x="320" y="100" text-anchor="middle" font-size="15" fill="#475467">Claude Code · Codex · ZCode · anything with a base URL</text>

  <!-- agent -> proxy -->
  <line x1="130" y1="120" x2="130" y2="196" stroke="#475467" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="146" y="156" font-size="14" fill="#475467">full transcript, however long</text>
  <text x="146" y="175" font-size="14" fill="#475467">(base URL points at the proxy)</text>

  <!-- proxy -->
  <rect x="60" y="200" width="520" height="400" rx="12" fill="#EFFAFA" stroke="#0E7C86" stroke-width="2"/>
  <text x="86" y="240" font-size="20" font-weight="700" fill="#0F172A">Smart Context Compressor</text>
  <text x="86" y="262" font-size="14" fill="#475467">one Python file · no injected tools · no model turns spent</text>
  <g font-size="16" fill="#0F172A">
    <circle cx="104" cy="306" r="15" fill="#0E7C86"/><text x="104" y="311" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
    <text x="134" y="304">Parse the request</text>
    <text x="134" y="323" font-size="13" fill="#475467">Anthropic Messages · Chat Completions · Responses</text>

    <circle cx="104" cy="366" r="15" fill="#0E7C86"/><text x="104" y="371" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
    <text x="134" y="364">Shrink old tool output, for free</text>
    <text x="134" y="383" font-size="13" fill="#475467">head + error lines + tail · repeated calls dropped</text>

    <circle cx="104" cy="426" r="15" fill="#0E7C86"/><text x="104" y="431" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
    <text x="134" y="424">Fold the oldest messages into notes</text>
    <text x="134" y="443" font-size="13" fill="#475467">only when ~70% full, so the prefix stays cacheable</text>

    <circle cx="104" cy="486" r="15" fill="#0E7C86"/><text x="104" y="491" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">4</text>
    <text x="134" y="484">Archive everything removed</text>
    <text x="134" y="503" font-size="13" fill="#475467">SQLite, full-text indexed</text>

    <circle cx="104" cy="546" r="15" fill="#0E7C86"/><text x="104" y="551" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">5</text>
    <text x="134" y="544">Forward, and stream the reply back untouched</text>
    <text x="134" y="563" font-size="13" fill="#475467">if anything fails, the original request goes through</text>
  </g>

  <!-- proxy -> api -->
  <line x1="130" y1="600" x2="130" y2="676" stroke="#475467" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="146" y="644" font-size="14" fill="#475467">request ≤ window</text>
  <line x1="470" y1="600" x2="470" y2="676" stroke="#0E7C86" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrowAccent)"/>
  <text x="458" y="634" text-anchor="end" font-size="13" fill="#0E7C86">background call:</text>
  <text x="458" y="652" text-anchor="end" font-size="13" fill="#0E7C86">model writes the next note</text>

  <!-- api -->
  <rect x="60" y="680" width="520" height="84" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="320" y="716" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">real model API</text>
  <text x="320" y="744" text-anchor="middle" font-size="15" fill="#475467">Anthropic · OpenAI · compatible</text>

  <!-- return path -->
  <path d="M580,722 H1200 V78 H584" fill="none" stroke="#475467" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="890" y="64" text-anchor="middle" font-size="14" fill="#475467">streaming response — passed through byte for byte</text>

  <!-- what the model sees -->
  <rect x="660" y="200" width="500" height="290" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="684" y="236" font-size="17" font-weight="700" fill="#0F172A">what the model receives — at most 100K tokens</text>
  <g font-size="15">
    <rect x="684" y="254" width="452" height="44" rx="7" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="700" y="281" font-weight="700" fill="#0F172A">system + tools</text><text x="1120" y="281" text-anchor="end" fill="#475467">untouched</text>
    <rect x="684" y="308" width="452" height="44" rx="7" fill="#CFEFF1" stroke="#0E7C86"/>
    <text x="700" y="335" font-weight="700" fill="#0F172A">notes</text><text x="1120" y="335" text-anchor="end" fill="#475467">oldest work, append-only, merged when full</text>
    <rect x="684" y="362" width="452" height="44" rx="7" fill="#E6F6F7" stroke="#7CC5CB"/>
    <text x="700" y="389" font-weight="700" fill="#0F172A">cold zone</text><text x="1120" y="389" text-anchor="end" fill="#475467">real messages, tool output digested</text>
    <rect x="684" y="416" width="452" height="44" rx="7" fill="#FFFFFF" stroke="#94A3B8"/>
    <text x="700" y="443" font-weight="700" fill="#0F172A">hot zone</text><text x="1120" y="443" text-anchor="end" fill="#475467">most recent messages, verbatim</text>
  </g>
  <line x1="580" y1="396" x2="656" y2="396" stroke="#0E7C86" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrowAccent)"/>
  <text x="618" y="386" text-anchor="middle" font-size="12" fill="#0E7C86">steps 2–3</text>

  <!-- archive -->
  <rect x="660" y="516" width="500" height="150" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="684" y="550" font-size="17" font-weight="700" fill="#0F172A">archive — the agent reads it from its own shell</text>
  <text x="684" y="582" font-size="15" font-weight="700" fill="#0F172A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ctxc recall r:1a2b3c4d5e --grep REGEX</text>
  <text x="684" y="602" font-size="14" fill="#475467">the original of any digested tool output or folded range</text>
  <text x="684" y="632" font-size="15" font-weight="700" fill="#0F172A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ctxc search WORDS</text>
  <text x="684" y="652" font-size="14" fill="#475467">full-text search over everything ever removed</text>
  <line x1="580" y1="492" x2="656" y2="560" stroke="#0E7C86" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrowAccent)"/>
  <text x="604" y="548" text-anchor="middle" font-size="12" fill="#0E7C86">step 4</text>
</svg>
